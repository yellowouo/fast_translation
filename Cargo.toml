[package]
name = "fast_translation"
version = "0.1.0"
edition = "2021"
description = "Fast and lightweight translation tool for Windows"
license = "MIT"

[build-dependencies]
slint-build = "1.17.1"
winres = "0.1"

[dependencies]
slint = "1.17.1"
windows = { version = "0.58", features = [
    "Win32",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_Graphics_Gdi",
    "Win32_Media_Speech",
    "Win32_System_Threading",
    "Foundation",
    "Foundation_Collections",
    "Media_SpeechSynthesis",
    "Media_Playback",
    "Media_Core",
    "Storage_Streams",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
lru = "0.12"
anyhow = "1"
once_cell = "1"
rand = "0.8"
md5 = "0.7"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
